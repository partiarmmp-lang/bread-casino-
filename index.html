<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bread Casino</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #1e1e38, #0a0a14); color: white; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,215,0,0.2); }
        .logo { font-size: 22px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); }
        .balance-box { background: rgba(255,215,0,0.1); border: 1px solid #ffd700; padding: 8px 15px; border-radius: 20px; font-weight: bold; }
        .action-buttons { display: flex; gap: 15px; justify-content: center; padding: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-deposit { background: #00c853; color: white; }
        .btn-withdraw { background: #d32f2f; color: white; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; max-width: 600px; margin: 0 auto; }
        .game-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 30px 20px; text-align: center; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; }
        .game-icon { font-size: 50px; margin-bottom: 15px; }
        .game-title { font-size: 18px; font-weight: 700; }
        #auth-container { display: flex; align-items: center; }
        
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e38; padding: 30px; border-radius: 20px; width: 80%; max-width: 300px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: none; background: #0a0a14; color: white; font-size: 18px; text-align: center; box-sizing: border-box; }
        .modal-btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; background: #00c853; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🍞 BREAD</div>
        <div id="auth-container">
            <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="Poblatoh_bot" data-size="medium" data-radius="10" data-auth-url="https://partiarmmp-lang.github.io/bread-casino-/" data-request-access="write"></script>
        </div>
        <div class="balance-box" id="balance-box" style="display: none;">
            💰 <span id="balance-display">0.00</span> USDT
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-deposit" onclick="openModal('deposit')">Пополнить</button>
        <button class="btn btn-withdraw" onclick="openModal('withdraw')">Вывести</button>
    </div>

    <div class="games-grid">
        <a href="plinko.html" class="game-card"><div class="game-icon">🎰</div><div class="game-title">PLINKO</div></a>
        <a href="slots.html" class="game-card"><div class="game-icon">🍒</div><div class="game-title">СЛОТЫ</div></a>
        <a href="crash.html" class="game-card"><div class="game-icon">🚀</div><div class="game-title">CRASH</div></a>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modal-title">Пополнение</h3>
            <input type="number" id="amount-input" value="1" step="0.1">
            <button class="modal-btn" onclick="submitAction()">Подтвердить</button>
            <button class="modal-btn" style="background: #555;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://bread-casino-14.onrender.com';

        function getUserId() {
            return localStorage.getItem('tg_user_id') || '';
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            let url = API_URL + endpoint;
            const userId = getUserId();
            
            if (userId) {
                url += (url.includes('?') ? '&' : '?') + 'user_id=' + userId;
            }

            if (method === 'GET' && body) {
                for (const key in body) {
                    url += '&' + key + '=' + encodeURIComponent(body[key]);
                }
            }

            try {
                const response = await fetch(url, { method: method });
                
                // Читаем ответ как текст, чтобы увидеть ошибку, даже если это не JSON
                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    // Если это не JSON, значит сервер вернул HTML-ошибку (например, 500)
                    throw new Error("Сервер вернул HTML вместо JSON. Код: " + response.status + ". Текст: " + text.substring(0, 50));
                }

                if (!response.ok) {
                    throw new Error(data.error || "Ошибка сервера: " + response.status);
                }
                return data;
            } catch (error) {
                alert("ОШИБКА: " + error.message);
                throw error;
            }
        }

        let actionType = '';

        window.openModal = function(type) {
            if (!getUserId()) {
                return alert("Пожалуйста, войдите через Telegram!");
            }
            actionType = type;
            document.getElementById('modal-title').textContent = type === 'deposit' ? 'Пополнение (USDT)' : 'Вывод (мин. 3 USDT)';
            document.getElementById('amount-input').value = type === 'deposit' ? '1' : '3';
            document.getElementById('modal').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('modal').style.display = 'none';
        };

        window.submitAction = async function() {
            const amount = parseFloat(document.getElementById('amount-input').value);
            closeModal();

            if (actionType === 'deposit') {
                try {
                    const res = await apiRequest('/api/topup', 'GET', { amount: amount });
                    if (res.pay_url) {
                        // Перекидываем на оплату
                        window.location.href = res.pay_url;
                    } else {
                        alert("Сервер не вернул ссылку на оплату. Ответ: " + JSON.stringify(res));
                    }
                } catch (e) {
                    // Ошибка уже показана в apiRequest
                }
            } else if (actionType === 'withdraw') {
                try {
                    const res = await apiRequest('/api/withdraw', 'POST', { amount: amount });
                    alert("Вывод успешен!");
                    updateBalanceUI();
                } catch (e) {
                    // Ошибка уже показана
                }
            }
        };

        async function updateBalanceUI() {
            const display = document.getElementById('balance-display');
            if (!display) return;
            try {
                const data = await apiRequest('/api/balance');
                display.textContent = parseFloat(data.balance).toFixed(2) + ' USDT';
            } catch (error) {
                display.textContent = "Ошибка";
            }
        }

        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('id') && urlParams.has('hash')) {
                localStorage.setItem('tg_user_id', urlParams.get('id'));
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            if (getUserId()) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('balance-box').style.display = 'block';
                updateBalanceUI();
            }
        });
    </script>
</body>
</html>
