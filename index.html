<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bread Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 24px; font-weight: bold; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        
        /* Стиль для кнопки баланса/входа */
        .balance-box {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .balance-box:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .action-buttons { display: flex; gap: 10px; }
        .btn { padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-deposit { background: #00c853; color: white; }
        .btn-withdraw { background: #d32f2f; color: white; }
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 600px; margin: 0 auto; }
        .game-card {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 20px; text-align: center; cursor: pointer;
            transition: 0.3s; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center;
        }
        .game-card:hover {
            background: rgba(255, 255, 255, 0.1); transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: #ffd700;
        }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-title { font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🍞 BREAD CASINO</div>
        <!-- Кнопка Войти / Баланс -->
        <div id="auth-container">
            <div class="balance-box" id="auth-btn" onclick="loginViaBot()">
                💰 <span id="balance-display">Войдите</span>
            </div>
        </div>
    </div>

    <div class="action-buttons" style="padding: 15px; justify-content: center;">
        <button class="btn btn-deposit" onclick="showTopup()">Пополнить</button>
        <button class="btn btn-withdraw" onclick="showWithdraw()">Вывести</button>
    </div>

    <div class="games-grid">
        <a href="slots.html" class="game-card">
            <div class="game-icon">🎰</div>
            <div class="game-title">Слоты</div>
        </a>
        <a href="crash.html" class="game-card">
            <div class="game-icon">🚀</div>
            <div class="game-title">Crash</div>
        </a>
        <a href="site.html" class="game-card">
            <div class="game-icon">🎲</div>
            <div class="game-title">Все игры</div>
        </a>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Функция входа через бота (открывает бота и передает метку)
        function loginViaBot() {
            // Если мы уже в Telegram (Mini App), кнопка не нужна
            if (tg.initData) return;
            
            // Если мы в браузере, перекидываем в бота
            window.location.href = "https://t.me/Poblatoh_bot?start=site_login";
        }

        // Инициализация при загрузке
        window.addEventListener('load', () => {
            // Если зашли из бота (есть initData)
            if (tg.initData) {
                // Сохраняем данные
                localStorage.setItem('tg_init_data', tg.initData);
                // Меняем кнопку на баланс
                document.getElementById('auth-btn').onclick = null;
                document.getElementById('auth-btn').style.cursor = 'default';
                // Запрашиваем баланс
                updateBalanceUI();
            } else if (localStorage.getItem('tg_init_data')) {
                // Если уже входили ранее (сохранено в браузере)
                document.getElementById('auth-btn').onclick = null;
                document.getElementById('auth-btn').style.cursor = 'default';
                updateBalanceUI();
            } else {
                // Если зашли в браузере и не авторизованы
                document.getElementById('balance-display').textContent = "Войдите";
            }
        });

        // Вспомогательные функции для кнопок
        function showTopup() {
            if (!getInitData()) return alert("Сначала нажмите 'Войдите' и авторизуйтесь в Telegram!");
            let amount = prompt("Введите сумму пополнения в USDT:", "1");
            if (amount) {
                API.topup(parseFloat(amount)).then(res => {
                    window.open(res.pay_url, '_blank');
                    alert("Оплатите счет в открывшемся окне. После оплаты нажмите ОК.");
                    setTimeout(() => {
                        API.checkPayment(res.invoice_id).then(check => {
                            if (check.paid) { alert("Баланс пополнен!"); updateBalanceUI(); }
                        });
                    }, 5000);
                }).catch(e => alert(e.message));
            }
        }

        function showWithdraw() {
            if (!getInitData()) return alert("Сначала нажмите 'Войдите' и авторизуйтесь в Telegram!");
            let amount = prompt("Введите сумму вывода (мин. 3 USDT):", "3");
            if (amount) {
                API.withdraw(parseFloat(amount)).then(res => {
                    alert("Вывод успешен! Проверьте CryptoBot."); updateBalanceUI();
                }).catch(e => alert(e.message));
            }
        }

        // Переопределяем функцию обновления баланса, чтобы она меняла именно наш элемент
        async function updateBalanceUI() {
            const display = document.getElementById('balance-display');
            try {
                const data = await API.getBalance();
                display.textContent = parseFloat(data.balance).toFixed(2) + ' USDT';
                // Убираем кнопку "Войти", если баланс загрузился
                document.getElementById('auth-btn').onclick = null;
                document.getElementById('auth-btn').style.borderColor = "#00c853"; // Зеленая рамка при успехе
            } catch (error) {
                console.error('Ошибка баланса:', error);
                display.textContent = 'Ошибка';
            }
        }
    </script>
</body>
</html>
