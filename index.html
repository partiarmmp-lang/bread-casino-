<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BREAD CASINO | Plinko</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; overflow: hidden; }
        h1 { color: #ffcc00; font-size: 24px; margin-bottom: 5px; }
        #userInfo { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        #balance { font-size: 18px; margin-bottom: 15px; color: #00ff00; }
        canvas { background-color: #1e1e1e; border-radius: 10px; display: block; margin: 0 auto; box-shadow: 0 0 20px rgba(255, 204, 0, 0.2); }
        .controls { margin-top: 15px; }
        input { padding: 10px; font-size: 16px; border-radius: 5px; border: none; width: 80px; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #ffcc00; color: #000; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #555; color: #999; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>🎰 BREAD PLINKO</h1>
    <div id="userInfo">Загрузка...</div>
    <div id="balance">Баланс: <span id="balance-val">...</span> USDT</div>
    
    <canvas id="gameCanvas" width="320" height="400"></canvas>

    <div class="controls">
        <input type="number" id="betAmount" value="0.10" min="0.05" step="0.05">
        <button id="dropBtn" onclick="dropBall()" disabled>Бросить</button>
    </div>

    <script>
        // ЗАМЕНИ ЭТУ ССЫЛКУ НА АДРЕС ТВОЕГО СЕРВЕРА (Render / VPS)
        const API_URL = "https://bread-casino-3.onrender.com"; 
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let balance = 0.00;
        let isDropping = false;
        let userId = null;

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- АВТОРИЗАЦИЯ И ЗАГРУЗКА БАЛАНСА ---
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            document.getElementById('userInfo').innerText = `Игрок: ${tg.initDataUnsafe.user.first_name}`;
            
            // Запрашиваем баланс с сервера
            fetch(API_URL + '/api/balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                balance = data.balance || 0;
                document.getElementById('balance-val').innerText = balance.toFixed(2);
                document.getElementById('dropBtn').disabled = false;
            })
            .catch(err => {
                document.getElementById('balance-val').innerText = "Ошибка сети";
            });
        } else {
            document.getElementById('userInfo').innerText = "Откройте через бота!";
            document.getElementById('balance-val').innerText = "0.00";
        }

        // --- ЛОГИКА ИГРЫ (ФИЗИКА) ---
        let ball = { x: 160, y: 20, vx: 0, vy: 0, radius: 6 };
        let pegs = [];
        let buckets = [];
        
        const rows = 12;
        const pegRadius = 4;
        const startY = 60;
        const spacingY = 25;
        const spacingX = 24;
        
        for (let row = 0; row < rows; row++) {
            const numPegs = row + 3;
            const startX = 160 - (numPegs - 1) * spacingX / 2;
            for (let i = 0; i < numPegs; i++) {
                pegs.push({ x: startX + i * spacingX, y: startY + row * spacingY, radius: pegRadius });
            }
        }

        const multipliers = [10, 3, 1.5, 1, 0.5, 0.2, 0.2, 0.5, 1, 1.5, 3, 10];
        const bucketWidth = 320 / multipliers.length;
        
        for (let i = 0; i < multipliers.length; i++) {
            buckets.push({ x: i * bucketWidth, width: bucketWidth, mult: multipliers[i] });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#aaa";
            pegs.forEach(peg => { ctx.beginPath(); ctx.arc(peg.x, peg.y, peg.radius, 0, Math.PI * 2); ctx.fill(); });
            buckets.forEach((b) => {
                ctx.fillStyle = b.mult >= 3 ? "#ff4444" : (b.mult >= 1 ? "#ffcc00" : "#44ff44");
                ctx.fillRect(b.x + 2, canvas.height - 30, b.width - 4, 30);
                ctx.fillStyle = "#000"; ctx.font = "bold 12px Arial"; ctx.textAlign = "center";
                ctx.fillText("x" + b.mult, b.x + b.width / 2, canvas.height - 12);
            });
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = "#ffcc00"; ctx.fill();
        }

        function updatePhysics() {
            if (!isDropping) return;
            ball.vy += 0.3; 
            ball.y += ball.vy;
            ball.x += ball.vx;
            if (ball.x < ball.radius) { ball.x = ball.radius; ball.vx *= -0.5; }
            if (ball.x > canvas.width - ball.radius) { ball.x = canvas.width - ball.radius; ball.vx *= -0.5; }
            pegs.forEach(peg => {
                let dx = ball.x - peg.x, dy = ball.y - peg.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < ball.radius + peg.radius) {
                    let angle = Math.atan2(dy, dx);
                    ball.x = peg.x + Math.cos(angle) * (ball.radius + peg.radius);
                    ball.y = peg.y + Math.sin(angle) * (ball.radius + peg.radius);
                    ball.vx = (Math.random() - 0.5) * 4; 
                    ball.vy = Math.abs(ball.vy) * 0.5 + 1; 
                }
            });
            if (ball.y > canvas.height - 30) {
                isDropping = false;
                document.getElementById('dropBtn').disabled = false;
            }
            draw(); requestAnimationFrame(updatePhysics);
        }

        function dropBall() {
            if (isDropping || !userId) return;
            let bet = parseFloat(document.getElementById('betAmount').value);
            if (balance < bet) { alert("Недостаточно средств!"); return; }
            
            balance -= bet;
            document.getElementById('balance-val').innerText = balance.toFixed(2);
            
            isDropping = true;
            ball = { x: 160, y: 20, vx: (Math.random() - 0.5) * 2, vy: 0, radius: 6 };
            document.getElementById('dropBtn').disabled = true;
            updatePhysics();

            // Отправляем ставку на сервер
            fetch(API_URL + '/api/play', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId, bet: bet })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    balance += bet; // Возврат при ошибке
                    document.getElementById('balance-val').innerText = balance.toFixed(2);
                    return;
                }
                // Ждем, пока шарик долетит, и показываем результат
                setTimeout(() => {
                    balance = data.balance;
                    document.getElementById('balance-val').innerText = balance.toFixed(2);
                    if (data.win > 0) {
                        alert(`🎉 Выигрыш! Множитель x${data.mult}. Вы получили ${data.win.toFixed(2)} USDT`);
                    } else {
                        alert(`😢 Множитель x${data.mult}. Вы проиграли.`);
                    }
                }, 2500);
            });
        }
        draw();
    </script>
</body>
</html>
