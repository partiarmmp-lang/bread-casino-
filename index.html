<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bread Casino</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #1e1e38, #0a0a14); color: white; min-height: 100vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,215,0,0.2); }
        .logo { font-size: 22px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); letter-spacing: 1px; }
        .balance-box { background: rgba(255,215,0,0.1); border: 1px solid #ffd700; padding: 8px 15px; border-radius: 20px; font-weight: bold; box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        .action-buttons { display: flex; gap: 15px; justify-content: center; padding: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; font-family: 'Montserrat', sans-serif; }
        .btn:active { transform: scale(0.95); }
        .btn-deposit { background: linear-gradient(135deg, #00c853, #009624); color: white; box-shadow: 0 4px 15px rgba(0,200,83,0.4); }
        .btn-withdraw { background: linear-gradient(135deg, #d32f2f, #9a0007); color: white; box-shadow: 0 4px 15px rgba(211,47,47,0.4); }
        
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 20px; max-width: 600px; margin: 0 auto; }
        .game-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; padding: 30px 20px; text-align: center; cursor: pointer; 
            text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center;
            transition: 0.3s; position: relative; overflow: hidden;
        }
        .game-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,215,0,0.1), transparent);
            transform: translateX(-100%); transition: 0.5s;
        }
        .game-card:hover::before { transform: translateX(100%); }
        .game-card:hover { border-color: #ffd700; box-shadow: 0 10px 25px rgba(255,215,0,0.2); }
        .game-icon { font-size: 50px; margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        .game-title { font-size: 18px; font-weight: 700; }
        #auth-container { display: flex; align-items: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🍞 BREAD CASINO</div>
        <div id="auth-container">
            <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="Poblatoh_bot" data-size="medium" data-radius="10" data-auth-url="https://partiarmmp-lang.github.io/bread-casino-/" data-request-access="write"></script>
        </div>
        <div class="balance-box" id="balance-box" style="display: none;">
            💰 <span id="balance-display">0.00</span> USDT
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-deposit" onclick="showTopup()">Пополнить</button>
        <button class="btn btn-withdraw" onclick="showWithdraw()">Вывести</button>
    </div>

    <div class="games-grid">
        <a href="plinko.html" class="game-card">
            <div class="game-icon">🎰</div>
            <div class="game-title">PLINKO</div>
        </a>
        <a href="slots.html" class="game-card">
            <div class="game-icon">🍒</div>
            <div class="game-title">СЛОТЫ</div>
        </a>
        <a href="crash.html" class="game-card">
            <div class="game-icon">🚀</div>
            <div class="game-title">CRASH</div>
        </a>
        <a href="site.html" class="game-card">
            <div class="game-icon">🎲</div>
            <div class="game-title">ВСЕ ИГРЫ</div>
        </a>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('id') && urlParams.has('hash')) {
            localStorage.setItem('tg_user_id', urlParams.get('id'));
            window.history.replaceState({}, document.title, window.location.pathname);
            initUser();
        } else if (localStorage.getItem('tg_user_id')) {
            initUser();
        }

        function initUser() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('balance-box').style.display = 'block';
            updateBalanceUI();
        }

        function showTopup() {
            if (!localStorage.getItem('tg_user_id')) return alert("Пожалуйста, войдите через Telegram!");
            let amount = prompt("Введите сумму пополнения в USDT (мин. 0.05):", "1");
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                if (amount < 0.05) return alert("Минимальная сумма 0.05 USDT");

                API.topup(amount).then(res => {
                    window.open(res.pay_url, '_blank');
                    alert("Оплатите счет в открывшемся окне. После оплаты нажмите ОК.");
                    setTimeout(() => {
                        API.checkPayment(res.invoice_id).then(check => {
                            if (check.paid) { alert("Баланс успешно пополнен!"); updateBalanceUI(); }
                            else { alert("Оплата еще не поступила. Подождите пару минут."); }
                        });
                    }, 5000);
                }).catch(e => alert("Ошибка: " + e.message));
            }
        }

        function showWithdraw() {
            if (!localStorage.getItem('tg_user_id')) return alert("Пожалуйста, войдите через Telegram!");
            let amount = prompt("Введите сумму вывода в USDT (минимум 3 USDT):", "3");
            if (amount && !isNaN(amount)) {
                amount = parseFloat(amount);
                if (amount < 3.0) return alert("Минимальная сумма для вывода — 3 USDT");
                API.withdraw(amount).then(res => {
                    alert("Вывод успешно выполнен! Проверьте ваш CryptoBot.");
                    updateBalanceUI();
                }).catch(e => alert("Ошибка при выводе: " + e.message));
            }
        }
    </script>
</body>
</html>
