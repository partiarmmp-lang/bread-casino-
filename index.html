<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bread Casino</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #1e1e38, #0a0a14); color: white; min-height: 100vh; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,215,0,0.2); }
        .logo { font-size: 20px; font-weight: 900; color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.6); }
        
        /* Контейнер для виджета входа */
        #auth-container { display: flex; align-items: center; }
        
        .balance-box { text-align: right; background: rgba(255,215,0,0.1); border: 1px solid #ffd700; padding: 5px 15px; border-radius: 15px; display: none; }
        .balance-total { font-size: 18px; font-weight: bold; color: #fff; }
        .balance-details { font-size: 11px; color: #aaa; margin-top: 2px; }
        .balance-bonus { color: #ffd700; }

        .action-buttons { display: flex; gap: 15px; justify-content: center; padding: 20px; }
        .btn { padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-deposit { background: #00c853; color: white; }
        .btn-withdraw { background: #d32f2f; color: white; }
        
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 600px; margin: 0 auto; }
        .game-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 25px 10px; text-align: center; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .game-card:active { transform: scale(0.95); }
        .game-icon { font-size: 45px; margin-bottom: 10px; }
        .game-title { font-size: 16px; font-weight: 700; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0a0a14; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #333; z-index: 100; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #777; text-decoration: none; font-size: 11px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: #ffd700; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }

        #modal, #waitingModal, #profileModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #1e1e38; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; border: 1px solid #ffd700; }
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 10px; border: none; background: #0a0a14; color: white; font-size: 18px; text-align: center; box-sizing: border-box; }
        .modal-btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 10px; background: #00c853; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .ref-link-box { background: #0a0a14; border: 1px dashed #ffd700; padding: 12px; border-radius: 10px; word-break: break-all; font-size: 13px; margin: 15px 0; color: #00c853; }

        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 4px solid rgba(255,215,0,0.3); border-top: 4px solid #ffd700; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🍞 BREAD</div>
        
        <!-- ВИДЖЕТ ВХОДА ЧЕРЕЗ TELEGRAM -->
        <div id="auth-container">
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                    data-telegram-login="Poblatoh_bot" 
                    data-size="medium" 
                    data-radius="10" 
                    data-auth-url="https://partiarmmp-lang.github.io/bread-casino-/" 
                    data-request-access="write"></script>
        </div>
        
        <div class="balance-box" id="balance-box">
            <div class="balance-total"><span id="balance-display">0.00</span> USDT</div>
            <div class="balance-details">Бонус: <span class="balance-bonus" id="bonus-display">0.00</span></div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-deposit" onclick="openModal('deposit')">Пополнить</button>
        <button class="btn btn-withdraw" onclick="openModal('withdraw')">Вывести</button>
    </div>

    <div class="games-grid">
        <a href="plinko.html" class="game-card"><div class="game-icon">🎰</div><div class="game-title">PLINKO</div></a>
        <a href="slots.html" class="game-card"><div class="game-icon">🍒</div><div class="game-title">СЛОТЫ</div></a>
        <a href="crash.html" class="game-card"><div class="game-icon">🚀</div><div class="game-title">CRASH</div></a>
        <a href="mines.html" class="game-card"><div class="game-icon">💣</div><div class="game-title">МИНЫ</div></a>
        <a href="lottery.html" class="game-card"><div class="game-icon">🎟️</div><div class="game-title">ЛОТЕРЕЯ</div></a>
        <a href="clicker.html" class="game-card"><div class="game-icon">🪙</div><div class="game-title">КЛИКЕР</div></a>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active"><i>🏠</i><span>Игры</span></div>
        <div class="nav-item" onclick="openProfile()"><i>👤</i><span>Профиль</span></div>
        <div class="nav-item" onclick="window.location.reload()"><i>🔄</i><span>Обновить</span></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h3 id="modal-title">Пополнение</h3>
            <input type="number" id="amount-input" value="1" step="0.1">
            <button class="modal-btn" onclick="submitAction()">Подтвердить</button>
            <button class="modal-btn" style="background: #555;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <div id="profileModal">
        <div class="modal-content">
            <h3 style="color:#ffd700; margin-top:0;">👤 Профиль</h3>
            <p>Ваш ID: <span id="user-id-display" style="color:#aaa;">...</span></p>
            <h4 style="color:#ffd700; margin-bottom:5px;">👥 Партнерка</h4>
            <div class="ref-link-box" id="ref-link">Загрузка...</div>
            <button class="modal-btn" onclick="copyRef()" style="background:#0088cc;">Скопировать ссылку</button>
            <button class="modal-btn" onclick="closeProfile()" style="background: #333;">Закрыть</button>
        </div>
    </div>

    <div id="waitingModal">
        <div class="modal-content">
            <h3 style="color:#ffd700;">Ожидание оплаты</h3>
            <p style="font-size:14px; color:#aaa;">Оплатите счет в открывшемся окне. После оплаты нажмите кнопку ниже.</p>
            <button class="modal-btn" onclick="checkPaymentStatus()" id="checkPayBtn">✅ Я оплатил</button>
            <button class="modal-btn" style="background: #333; margin-top:10px;" onclick="closeWaiting()">Закрыть</button>
        </div>
    </div>

    <div id="loader">
        <div class="spinner"></div>
        <div style="color: #ffd700; font-weight: bold;">Обработка...</div>
    </div>

    <script>
        const API_URL = 'https://bread-casino-14.onrender.com';
        let currentInvoiceId = null;

        function getUserId() { return localStorage.getItem('tg_user_id') || ''; }
        function showLoader() { document.getElementById('loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('loader').style.display = 'none'; }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            let url = API_URL + endpoint;
            const userId = getUserId();
            if (userId) url += (url.includes('?') ? '&' : '?') + 'user_id=' + userId;
            if (method === 'GET' && body) {
                for (const key in body) url += '&' + key + '=' + encodeURIComponent(body[key]);
            }
            const response = await fetch(url, { method: method });
            const text = await response.text();
            let data;
            try { data = JSON.parse(text); } catch (e) { throw new Error("Сервер вернул не JSON"); }
            if (!response.ok) throw new Error(data.error || "Ошибка сервера");
            return data;
        }

        async function initApp() {
            let userId = getUserId();
            const urlParams = new URLSearchParams(window.location.search);
            
            // 1. Если пришли из Telegram WebApp
            if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
                userId = window.Telegram.WebApp.initDataUnsafe.user.id;
                localStorage.setItem('tg_user_id', userId);
            }
            // 2. Если пришли по ссылке от виджета входа (там есть ?id=...)
            else if (urlParams.has('id')) {
                localStorage.setItem('tg_user_id', urlParams.get('id'));
                userId = urlParams.get('id');
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            if (userId) {
                // Скрываем виджет, показываем баланс
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('balance-box').style.display = 'block';
                
                const refId = urlParams.get('ref_id');
                try { await apiRequest('/api/register', 'POST', { ref_id: refId }); } catch (e) { console.log("Reg error: ", e); }
                updateBalanceUI();
            }
        }

        async function updateBalanceUI() {
            try {
                const data = await apiRequest('/api/balance');
                document.getElementById('balance-display').textContent = parseFloat(data.balance).toFixed(2);
                document.getElementById('bonus-display').textContent = parseFloat(data.bonus).toFixed(2);
            } catch (error) {
                document.getElementById('balance-display').textContent = "Error";
            }
        }

        function openProfile() {
            const userId = getUserId();
            if (!userId) return alert("Войдите через Telegram!");
            document.getElementById('user-id-display').innerText = userId;
            document.getElementById('ref-link').innerText = `https://t.me/Poblatoh_bot?start=ref_${userId}`;
            document.getElementById('profileModal').style.display = 'flex';
        }
        function closeProfile() { document.getElementById('profileModal').style.display = 'none'; }
        function copyRef() { navigator.clipboard.writeText(document.getElementById('ref-link').innerText).then(() => alert("Скопировано!")); }

        let actionType = '';
        window.openModal = function(type) {
            if (!getUserId()) return alert("Пожалуйста, войдите через Telegram!");
            actionType = type;
            document.getElementById('modal-title').textContent = type === 'deposit' ? 'Пополнение (USDT)' : 'Вывод (мин. 3 USDT)';
            document.getElementById('amount-input').value = type === 'deposit' ? '1' : '3';
            document.getElementById('modal').style.display = 'flex';
        };
        window.closeModal = function() { document.getElementById('modal').style.display = 'none'; };
        window.closeWaiting = function() { document.getElementById('waitingModal').style.display = 'none'; }

        window.submitAction = async function() {
            const amount = parseFloat(document.getElementById('amount-input').value);
            closeModal();

            if (actionType === 'deposit') {
                const newWindow = window.open('about:blank', '_blank');
                if (newWindow) newWindow.document.write('<h3 style="font-family:sans-serif;padding:40px;text-align:center;color:#000;">Создаем счет...</h3>');
                showLoader();
                try {
                    const res = await apiRequest('/api/topup', 'GET', { amount: amount });
                    if (res.pay_url) {
                        hideLoader();
                        currentInvoiceId = res.invoice_id;
                        if (newWindow) newWindow.location.href = res.pay_url;
                        else window.location.href = res.pay_url;
                        document.getElementById('waitingModal').style.display = 'flex';
                    } else {
                        hideLoader(); if (newWindow) newWindow.close();
                        alert("Сервер не вернул ссылку.");
                    }
                } catch (e) {
                    hideLoader(); if (newWindow) newWindow.close();
                    alert("Ошибка: " + e.message);
                }
            } else if (actionType === 'withdraw') {
                showLoader();
                try {
                    await apiRequest('/api/withdraw', 'POST', { amount: amount });
                    hideLoader(); alert("Вывод успешен!"); updateBalanceUI();
                } catch (e) { hideLoader(); alert("Ошибка: " + e.message); }
            }
        };
        
        window.checkPaymentStatus = async function() {
            if (!currentInvoiceId) return;
            const btn = document.getElementById('checkPayBtn');
            btn.textContent = "Проверяем..."; btn.disabled = true;
            try {
                const res = await apiRequest('/api/check_payment/' + currentInvoiceId);
                if (res.paid) { alert("🎉 Оплата получена!"); closeWaiting(); updateBalanceUI(); }
                else { alert("Счет еще не оплачен."); }
            } catch (e) { alert("Ошибка: " + e.message); } 
            finally { btn.textContent = "✅ Я оплатил"; btn.disabled = false; }
        }

        window.addEventListener('load', initApp);
    </script>
</body>
</html>
