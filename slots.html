<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BREAD CASINO | Deluxe Slots</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        body {
            background: #0f0f0f;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { font-size: 22px; color: #ffcc00; margin: 0 0 5px 0; text-shadow: 0 0 10px rgba(255, 204, 0, 0.5); }
        .balance { font-size: 18px; color: #00ff00; font-weight: 700; margin-bottom: 15px; }

        /* Игровое поле */
        .slot-machine {
            background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
            border: 3px solid #ffcc00;
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 3 Линии (ряда) */
        .grid-container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            position: relative;
        }

        .payline {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
            padding: 5px;
            position: relative;
        }

        .payline.active { background: rgba(255, 204, 0, 0.2); border: 1px solid #ffcc00; }
        
        /* Сами барабаны */
        .reel-window {
            width: 18%;
            height: 70px;
            background: #111;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.8), inset 0 -5px 10px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s linear;
        }

        .symbol {
            font-size: 35px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Панель управления */
        .controls {
            margin-top: 15px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        .row button {
            background: #444; color: #fff; border: none; width: 30px; height: 30px;
            border-radius: 5px; font-size: 18px; cursor: pointer;
        }

        .row input { background: transparent; border: none; color: #ffcc00; font-size: 18px; font-weight: bold; width: 60px; text-align: center; }

        .spin-btn {
            background: linear-gradient(180deg, #ffcc00 0%, #ff8800 100%);
            color: #000; border: none; padding: 15px; font-size: 20px;
            font-weight: 900; border-radius: 10px; cursor: pointer;
            text-transform: uppercase; box-shadow: 0 5px 0 #aa5500;
            transition: all 0.1s; margin-top: 10px;
        }

        .spin-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #aa5500; }
        .spin-btn:disabled { background: #555; color: #888; box-shadow: 0 5px 0 #333; transform: translateY(5px); }

        /* Всплывающие сообщения */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center;
            align-items: center; z-index: 100; flex-direction: column;
        }
        #overlay.show { display: flex; }
        .win-box {
            background: #111; border: 3px solid #ffcc00; padding: 30px; border-radius: 20px;
            text-align: center; animation: pop 0.3s ease-out;
        }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        .win-text { font-size: 32px; color: #00ff00; font-weight: 900; margin-bottom: 10px; }
        .freespin-text { font-size: 24px; color: #ffcc00; font-weight: 900; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>🎰 DELUXE SLOTS</h1>
    <div class="balance">Баланс: <span id="balance-val">...</span> USDT</div>

    <div class="slot-machine">
        <div class="grid-container" id="grid">
            <!-- Сетка 3x5 создастся через JS -->
        </div>
    </div>

    <div class="controls">
        <div class="row">
            <span>Ставка (на линию):</span>
            <div>
                <button onclick="changeBet('line', -0.01)">-</button>
                <input type="number" id="betLine" value="0.01" min="0.01" step="0.01" readonly>
                <button onclick="changeBet('line', 0.01)">+</button>
            </div>
        </div>
        <div class="row">
            <span>Линии (1-3):</span>
            <div>
                <button onclick="changeBet('lines', -1)">-</button>
                <input type="number" id="linesCount" value="1" min="1" max="3" readonly>
                <button onclick="changeBet('lines', 1)">+</button>
            </div>
        </div>
        <div class="row" style="justify-content: center; background: transparent; border: none; padding: 0;">
            <span style="color:#aaa; font-size:14px;">Итого ставка: <b id="totalBet" style="color:#ffcc00;">0.01</b> USDT</span>
        </div>
        
        <button class="spin-btn" id="spinBtn" onclick="spin()">Крутить</button>
        <div style="font-size: 12px; color: #aaa; margin-top: 5px;" id="freespinStatus"></div>
    </div>

    <div id="overlay" onclick="closeOverlay()">
        <div class="win-box">
            <div class="win-text" id="winAmount">+0.00 USDT</div>
            <div class="freespin-text" id="winFree" style="display:none;">+10 ФРИСПИНОВ!</div>
        </div>
    </div>

    <script>
        const API_URL = "https://bread-casino-3.onrender.com";
        const SYMBOLS = ["🍒", "🍋", "🍇", "🔔", "⭐", "💎", "7️⃣"];
        const SCATTER = "⭐";
        
        let balance = 0.00;
        let userId = null;
        let isSpinning = false;
        let freespinsLeft = 0; // Счетчик фриспинов
        
        let betLine = 0.01;
        let linesCount = 1;
        
        let reelStrips = [];
        const ROWS = 3;
        const REELS = 5;
        const SYMBOLS_PER_REEL = 15; // Длина ленты

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- ИНИЦИАЛИЗАЦИЯ ---
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            fetchBalance();
        } else {
            document.getElementById('balance-val').innerText = "Открой в боте!";
        }

        function fetchBalance() {
            fetch(API_URL + '/api/balance', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                balance = data.balance || 0;
                updateBalanceUI();
            });
        }

        function updateBalanceUI() {
            document.getElementById('balance-val').innerText = balance.toFixed(2);
        }

        // --- СОЗДАНИЕ СЕТКИ ---
        const gridContainer = document.getElementById('grid');
        
        for (let r = 0; r < ROWS; r++) {
            const payline = document.createElement('div');
            payline.className = 'payline' + (r === 0 ? ' active' : '');
            payline.id = 'line-' + r;
            
            for (let c = 0; c < REELS; c++) {
                const reelWindow = document.createElement('div');
                reelWindow.className = 'reel-window';
                
                const strip = document.createElement('div');
                strip.className = 'reel-strip';
                strip.id = `strip-${r}-${c}`;
                
                for (let i = 0; i < SYMBOLS_PER_REEL; i++) {
                    const sym = document.createElement('div');
                    sym.className = 'symbol';
                    sym.innerText = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
                    strip.appendChild(sym);
                }
                
                reelWindow.appendChild(strip);
                payline.appendChild(reelWindow);
                reelStrips.push({ r, c, strip });
            }
            gridContainer.appendChild(payline);
        }

        // --- УПРАВЛЕНИЕ СТАВКАМИ ---
        function changeBet(type, amount) {
            if (isSpinning || freespinsLeft > 0) return;
            
            if (type === 'line') {
                betLine += amount;
                if (betLine < 0.01) betLine = 0.01;
                if (betLine > 10) betLine = 10;
                document.getElementById('betLine').value = betLine.toFixed(2);
            } else if (type === 'lines') {
                linesCount += amount;
                if (linesCount < 1) linesCount = 1;
                if (linesCount > 3) linesCount = 3;
                document.getElementById('linesCount').value = linesCount;
                
                // Подсвечиваем активные линии
                for (let i = 0; i < 3; i++) {
                    document.getElementById('line-' + i).className = 'payline' + (i < linesCount ? ' active' : '');
                }
            }
            
            const total = betLine * linesCount;
            document.getElementById('totalBet').innerText = total.toFixed(2);
        }

        // --- ИГРА ---
        function spin() {
            if (isSpinning || !userId) return;
            
            let totalBet = parseFloat((betLine * linesCount).toFixed(2));
            
            // Если это фриспин, деньги не списываем
            if (freespinsLeft === 0) {
                if (balance < totalBet) {
                    alert("Недостаточно средств!");
                    return;
                }
                balance -= totalBet;
                updateBalanceUI();
            } else {
                freespinsLeft--;
                updateFreespinUI();
            }

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            // Запрос к серверу (передаем ставку на линию и кол-во линий, или флаг фриспина)
            fetch(API_URL + '/api/slots', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    user_id: userId, 
                    bet: totalBet, 
                    bet_line: betLine,
                    lines: linesCount,
                    is_freespin: freespinsLeft > 0 // Серверу важно знать, фриспин это или нет
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    return;
                }

                const resultGrid = data.grid; // Двумерный массив 3x5
                
                // Запускаем анимацию для каждого барабана с задержкой
                for (let c = 0; c < REELS; c++) {
                    for (let r = 0; r < ROWS; r++) {
                        let reelObj = reelStrips.find(x => x.r === r && x.c === c);
                        // Задержка зависит от колонки (барабаны останавливаются по очереди)
                        animateReel(reelObj.strip, resultGrid[r][c], 1000 + (c * 300));
                    }
                }

                // Ждем окончания анимации (5-й барабан)
                setTimeout(() => {
                    balance = data.balance;
                    updateBalanceUI();
                    
                    // Обработка фриспинов
                    if (data.freespins_won > 0) {
                        freespinsLeft += data.freespins_won;
                        updateFreespinUI();
                        showOverlay(data.win, data.freespins_won);
                        playSound('win');
                    } else if (data.win > 0) {
                        showOverlay(data.win, 0);
                        playSound('win');
                    } else {
                        playSound('lose');
                    }
                    
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                }, 2800); // Ждем, пока остановится последний барабан
            })
            .catch(err => {
                alert("Ошибка сервера");
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            });
        }

        function animateReel(strip, targetSymbol, duration) {
            const symbolElements = strip.children;
            let targetIndex = -1;
            
            // Ищем нужный символ ближе к концу ленты
            for (let i = symbolElements.length - 1; i >= 0; i--) {
                if (symbolElements[i].innerText === targetSymbol) {
                    targetIndex = i;
                    break;
                }
            }
            if (targetIndex === -1) targetIndex = 0;

            const symbolHeight = 70; // Должно совпадать с CSS
            const finalTransform = -(targetIndex * symbolHeight);

            // Сброс и анимация
            strip.style.transition = 'none';
            strip.style.transform = `translateY(${-(SYMBOLS_PER_REEL * symbolHeight)}px)`; // Ставим в конец
            void strip.offsetWidth;
            
            strip.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.7, 0.1, 1)`;
            strip.style.transform = `translateY(${finalTransform}px)`;
        }

        // --- ФРИСПИНЫ И UI ---
        function updateFreespinUI() {
            const status = document.getElementById('freespinStatus');
            if (freespinsLeft > 0) {
                status.innerText = `🔥 ФРИСПИНЫ: ${freespinsLeft} (x2)`;
                status.style.color = '#ffcc00';
                document.getElementById('spinBtn').innerText = "Крутить (Бесплатно)";
            } else {
                status.innerText = "";
                document.getElementById('spinBtn').innerText = "Крутить";
            }
        }

        function showOverlay(win, freespins) {
            if (win > 0) {
                document.getElementById('winAmount').innerText = `+${win.toFixed(2)} USDT`;
                document.getElementById('winAmount').style.display = 'block';
            } else {
                document.getElementById('winAmount').style.display = 'none';
            }
            
            if (freespins > 0) {
                document.getElementById('winFree').innerText = `⭐ +${freespins} ФРИСПИНОВ! ⭐`;
                document.getElementById('winFree').style.display = 'block';
            } else {
                document.getElementById('winFree').style.display = 'none';
            }
            
            document.getElementById('overlay').classList.add('show');
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('show');
        }

        // --- ЗВУКИ ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }
    </script>
</body>
</html>
