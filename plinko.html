<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bread Plinko</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at top, #1e1e38, #0a0a14); color: white; min-height: 100vh; display: flex; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .title { font-size: 20px; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .balance-box { background: rgba(255,215,0,0.1); border: 1px solid #ffd700; padding: 8px 15px; border-radius: 20px; font-weight: bold; }
        
        .game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .board { width: 100%; max-width: 400px; height: 400px; position: relative; margin-bottom: 30px; }
        
        .peg { position: absolute; width: 10px; height: 10px; background: #555; border-radius: 50%; box-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .ball { position: absolute; width: 24px; height: 24px; background: #ffd700; border-radius: 50%; box-shadow: 0 0 15px #ffd700, 0 0 30px #ffd700; z-index: 10; transition: top 0.05s linear, left 0.05s linear; }
        
        .controls { display: flex; gap: 15px; width: 100%; max-width: 400px; margin-top: 20px; }
        input { flex: 1; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; font-size: 16px; font-weight: bold; text-align: center; font-family: 'Montserrat', sans-serif; }
        input:focus { outline: none; border-color: #ffd700; }
        button { flex: 2; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: black; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255,215,0,0.4); font-family: 'Montserrat', sans-serif;}
        button:active { transform: scale(0.95); }
        button:disabled { background: #333; color: #666; box-shadow: none; cursor: not-allowed; }
        
        .back-btn { display: inline-block; margin-top: 30px; color: #aaa; text-decoration: none; font-weight: bold; font-size: 14px; padding: 10px 20px; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎰 PLINKO</div>
        <div class="balance-box">💰 <span id="balance-display">0.00</span> USDT</div>
    </div>

    <div class="game-container">
        <div class="board" id="board">
            <!-- Шарик -->
            <div class="ball" id="ball" style="left: 50%; top: 0%; transform: translate(-50%, -50%); display: none;"></div>
        </div>

        <div class="controls">
            <input type="number" id="bet-amount" value="0.10" step="0.10" min="0.01">
            <button id="drop-btn" onclick="dropBall()">Бросить</button>
        </div>
        
        <a href="index.html" class="back-btn">← В МЕНЮ</a>
    </div>

    <script src="assets/js/api.js"></script>
    <script>
        // Создаем визуальную сетку (колышки) для красоты
        const board = document.getElementById('board');
        const rows = 10;
        for (let r = 0; r < rows; r++) {
            const pegsInRow = r + 3;
            const rowWidth = (pegsInRow - 1) * 40;
            const startX = (board.offsetWidth / 2) - (rowWidth / 2);
            const y = (r * 40) + 40;

            for (let p = 0; p < pegsInRow; p++) {
                const peg = document.createElement('div');
                peg.className = 'peg';
                peg.style.left = (startX + p * 40) + 'px';
                peg.style.top = y + 'px';
                board.appendChild(peg);
            }
        }

        if (!getUserId()) {
            alert("Пожалуйста, войдите через Telegram!");
            window.location.href = 'index.html';
        } else {
            updateBalanceUI();
        }

        async function dropBall() {
            const amount = parseFloat(document.getElementById('bet-amount').value);
            if (amount < 0.01) return alert("Минимальная ставка 0.01 USDT");
            
            const btn = document.getElementById('drop-btn');
            const ball = document.getElementById('ball');
            
            btn.disabled = true;
            ball.style.display = 'block';
            ball.style.top = '0%';
            ball.style.left = '50%';

            try {
                // Запрос к серверу
                const res = await API.playPlinko(amount);
                
                // Анимация падения
                let posX = 50;
                let posY = 0;
                
                const interval = setInterval(() => {
                    posY += 4;
                    // Немного виляем в стороны
                    posX += (Math.random() - 0.5) * 6; 
                    
                    ball.style.top = posY + '%';
                    ball.style.left = posX + '%';
                    
                    if (posY >= 90) {
                        clearInterval(interval);
                        
                        // Показываем результат
                        if (res.multiplier >= 1) {
                            ball.style.boxShadow = '0 0 30px #00ff00';
                        } else {
                            ball.style.boxShadow = '0 0 30px #ff0000';
                        }
                        
                        document.getElementById('balance-display').textContent = res.balance.toFixed(2);
                        
                        setTimeout(() => {
                            if(res.multiplier >= 1) alert(`🎉 Выигрыш! Множитель: x${res.multiplier} (+${res.win_amount.toFixed(2)} USDT)`);
                            else alert(`😢 Проигрыш. Множитель: x${res.multiplier}`);
                            
                            ball.style.display = 'none';
                            ball.style.boxShadow = '0 0 15px #ffd700, 0 0 30px #ffd700';
                            btn.disabled = false;
                        }, 100);
                    }
                }, 20);
                
            } catch (e) {
                alert(e.message);
                btn.disabled = false;
                ball.style.display = 'none';
            }
        }
    </script>
</body>
</html>
