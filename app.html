<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BREAD CASINO | Официальный сайт</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');

        * { box-sizing: border-box; }
        
        body {
            background: radial-gradient(circle at top, #2a2a2a 0%, #0a0a0a 100%);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Шапка с балансом */
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #333;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .logo { font-size: 20px; font-weight: 900; color: #ffcc00; }
        .balance-box { text-align: right; }
        .balance-label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        .balance-value { font-size: 20px; color: #00ff00; font-weight: 900; }

        /* Сетка игр */
        .games-grid {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .game-card {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px 10px;
            text-align: center;
            border: 2px solid #333;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 120px;
        }

        .game-card:active { transform: scale(0.95); }
        .game-card:hover { border-color: #ffcc00; box-shadow: 0 0 15px rgba(255, 204, 0, 0.3); }

        /* Выделенная карточка (Колесо) */
        .game-card.featured {
            grid-column: span 2;
            background: linear-gradient(135deg, #1a1a1a 0%, #3a2a00 100%);
            border-color: #ffcc00;
            height: 100px;
            flex-direction: row;
            justify-content: space-around;
        }

        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-title { font-weight: 700; font-size: 14px; }
        
        .featured .game-icon { font-size: 50px; margin: 0; }
        .featured .game-title { font-size: 18px; color: #ffcc00; }

        /* Меню внизу */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #333;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #777;
            text-decoration: none;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item.active { color: #ffcc00; }
        .nav-item i { font-size: 20px; margin-bottom: 3px; }

        /* Профиль (для рефералки и истории) */
        .profile-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-content {
            background: #1a1a1a;
            border: 2px solid #ffcc00;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .profile-content h2 { color: #ffcc00; margin-top: 0; }
        
        .ref-link {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            word-break: break-all;
            font-size: 12px;
            margin: 15px 0;
            color: #00ff00;
        }

        .btn {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .btn.close { background: #333; color: #fff; margin-bottom: 0; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <div class="header">
        <div class="logo">🍞 BREAD CASINO</div>
        <div class="balance-box">
            <div class="balance-label">Ваш баланс</div>
            <div class="balance-value"><span id="balance-val">...</span> <span style="font-size:12px;">USDT</span></div>
        </div>
    </div>

    <!-- Сетка игр -->
    <div class="games-grid">
        
        <!-- Колесо (Выделенное) -->
        <div class="game-card featured" onclick="openWheel()">
            <div class="game-icon">🎡</div>
            <div class="game-title">КОЛЕСО ФОРТУНЫ</div>
        </div>

        <!-- Игры -->
        <a href="slots.html" class="game-card">
            <div class="game-icon">🎰</div>
            <div class="game-title">DELUXE SLOTS</div>
        </a>

        <a href="crash.html" class="game-card">
            <div class="game-icon">🚀</div>
            <div class="game-title">CRASH</div>
        </a>

        <a href="index.html" class="game-card">
            <div class="game-icon">🔵</div>
            <div class="game-title">PLINKO</div>
        </a>

        <div class="game-card" onclick="alert('Скоро!')">
            <div class="game-icon">🎲</div>
            <div class="game-title">МИНЫ</div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="alert('Вы уже на главной')">
            <i>🏠</i>
            <span>Главная</span>
        </div>
        <div class="nav-item" onclick="openProfile()">
            <i>👤</i>
            <span>Профиль</span>
        </div>
        <div class="nav-item" onclick="window.location.href='https://t.me/Poblatoh_bot'">
            <i>💬</i>
            <span>В бот</span>
        </div>
    </div>

    <!-- Модальное окно профиля (Рефералка) -->
    <div class="profile-modal" id="profileModal">
        <div class="profile-content">
            <h2>👤 Профиль</h2>
            <p>Твой ID: <span id="user-id-display" style="color:#aaa;">...</span></p>
            
            <h3 style="color:#ffcc00; margin-top:20px;">👥 Партнерка (10% / 3% / 1%)</h3>
            <p style="font-size:12px; color:#aaa;">Приводи друзей и получай % с их проигрышей!</p>
            <div class="ref-link" id="ref-link">Загрузка...</div>
            
            <button class="btn" onclick="copyRef()">Скопировать ссылку</button>
            <button class="btn close" onclick="closeProfile()">Закрыть</button>
        </div>
    </div>

    <script>
        // ЗАМЕНИ НА СВОЙ АДРЕС RENDER
        const API_URL = "https://bread-casino-3.onrender.com"; 
        let userId = null;
        let userBalance = 0;

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Инициализация
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
            document.getElementById('user-id-display').innerText = userId;
            
            // Ссылка на бота
            const botUsername = "Poblatoh_bot"; 
            document.getElementById('ref-link').innerText = `https://t.me/${botUsername}?start=ref_${userId}`;

            // Грузим баланс
            fetchBalance();
        } else {
            document.getElementById('balance-val').innerText = "Открой в боте!";
        }

        function fetchBalance() {
            fetch(API_URL + '/api/balance', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                userBalance = data.balance || 0;
                document.getElementById('balance-val').innerText = userBalance.toFixed(2);
            });
        }

        // --- ФУНКЦИИ ИНТЕРФЕЙСА ---
        function openProfile() {
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfile() {
            document.getElementById('profileModal').style.display = 'none';
        }

        function copyRef() {
            const link = document.getElementById('ref-link').innerText;
            navigator.clipboard.writeText(link).then(() => {
                alert("Ссылка скопирована!");
            });
        }

        function openWheel() {
            // Здесь будет код для колеса (следующий шаг)
            alert("Колесо скоро появится! Мы делаем анимацию как в Jetton.");
        }

        // Обновляем баланс при возвращении на страницу (из игр)
        window.addEventListener('focus', fetchBalance);
    </script>
</body>
</html>
